[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; === Extensions ===
[6001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
auth=6001
aors=6001
dtmf_mode=rfc4733
transport=transport-udp

[6001]
type=auth
auth_type=userpass
password=unsecurepassword
username=6001

[6001]
type=aor
max_contacts=1

[6002]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
auth=6002
aors=6002
dtmf_mode=rfc4733
transport=transport-udp

[6002]
type=auth
auth_type=userpass
password=6002
username=6002

[6002]
type=aor
max_contacts=1

; === Mock Trunk (for testing) ===
; In production, this would be your actual SIP provider
[my-trunk]
type=endpoint
context=from-external
disallow=all
allow=ulaw
aors=my-trunk

[my-trunk]
type=aor
contact=sip:mock-provider:5060
