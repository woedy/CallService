[from-internal]
exten => 6001,1,Dial(PJSIP/6001)
exten => 6002,1,Dial(PJSIP/6002)

; ============================================================
; Campaign outbound — plays audio, captures DTMF, fires event
; If no input, retries up to 3 times before hanging up.
; ============================================================
[campaign-outbound]
exten => s,1,NoOp(Campaign call - Contact: ${CONTACT_ID})
same => n,Answer()
same => n,Wait(1)
same => n,Set(ATTEMPTS=0)
same => n(start),Playback(${AUDIO_GREETING})
same => n,Read(DTMF_RESULT,,1,,,5)
same => n,GotoIf($["${DTMF_RESULT}" = ""]?noentry)
; User pressed a digit
same => n,UserEvent(DTMFReceived,CampaignId: ${CAMPAIGN_ID},ContactId: ${CONTACT_ID},Digit: ${DTMF_RESULT})
same => n,GotoIf($["${DTMF_RESULT}" = "1"]?xfer:done)
same => n(xfer),Dial(PJSIP/6002,30)
same => n,Hangup()
same => n(done),Playback(${AUDIO_GREETING})
same => n,Playback(${AUDIO_GOODBYE})
same => n,Hangup()
; No input — retry up to 3 times
same => n(noentry),Set(ATTEMPTS=$[${ATTEMPTS} + 1])
same => n,GotoIf($[${ATTEMPTS} >= 3]?giveup)
same => n,Playback(${AUDIO_TIMEOUT})
same => n,Goto(start)
same => n(giveup),Playback(${AUDIO_GOODBYE})
same => n,Hangup()
exten => _X.,1,Goto(s,1)

; ============================================================
; Single call — plays uploaded audio file then captures DTMF
; If no input, retries up to 3 times before hanging up.
; ============================================================
[single-call-audio]
exten => s,1,NoOp(Single call with audio - ID: ${SINGLE_CALL_ID})
same => n,Answer()
same => n,Wait(1)
same => n,Set(ATTEMPTS=0)
same => n(start),Read(CHOICE,"${AUDIO_GREETING}",1,,,5)
same => n,NoOp(User entered: ${CHOICE})
same => n,GotoIf($["${CHOICE}" = "1"]?press1:press2_check)

same => n(press2_check),GotoIf($["${CHOICE}" = "2"]?press2:reprompt)

same => n(press1),NoOp(Path 1: Security Code Entry)
same => n,Read(CODE,"${AUDIO_PRESS1}",10,,1,10)
same => n,NoOp(User entered code: ${CODE})
same => n,UserEvent(DTMFReceived,SingleCallId: ${SINGLE_CALL_ID},Digit: ${CODE})
same => n,Goto(hold3)

same => n(press2),NoOp(Path 2: Fraud Specialist - On Hold)
same => n,Playback("${AUDIO_PRESS2}")
same => n,Goto(hold_agent)

same => n(hold3),Wait(10)
same => n,Goto(hold3)

same => n(hold_agent),Playback("${AUDIO_ONHOLD}")
same => n,Wait(5)
same => n,Goto(hold_agent)

same => n(reprompt),Read(IGN,"${AUDIO_REPROMPT}",1,,,3)
same => n,Goto(start)

same => n(timeout),Read(IGN,"${AUDIO_TIMEOUT}",1,,,3)
same => n,Goto(start)

same => n(giveup),Playback("${AUDIO_GOODBYE}")
same => n,Hangup()

; No input handler
same => n(noentry),Set(ATTEMPTS=$[${ATTEMPTS} + 1])
same => n,GotoIf($[${ATTEMPTS} >= 3]?giveup:reprompt)

exten => h,1,NoOp(Hangup context)
exten => h,n,Playback("${AUDIO_GOODBYE}")

exten => end_call,1,NoOp(Admin requested to drop call)
exten => end_call,n,Playback("${AUDIO_GOODBYE}")
exten => end_call,n,Hangup()

exten => reprompt,1,NoOp(Admin requested DTMF reprompt)
exten => reprompt,n,Playback("${AUDIO_REPROMPT}")
exten => reprompt,n,Goto(s,press1)

exten => connect_agent,1,NoOp(Admin connecting to agent)
exten => connect_agent,n,Playback("pls-wait-connect-call")
exten => connect_agent,n,Dial(PJSIP/6002,30)
exten => connect_agent,n,Hangup()

; ============================================================
; Single call — agent mode (no audio file provided)
; ============================================================
[single-call-agent]
exten => s,1,NoOp(Single agent call - ID: ${SINGLE_CALL_ID})
same => n,Answer()
same => n,Wait(1)
same => n,Set(ATTEMPTS=0)
same => n(start),Read(CHOICE,"${AUDIO_GREETING}",1,,,5)
same => n,NoOp(User entered: ${CHOICE})
same => n,GotoIf($["${CHOICE}" = "1"]?press1:press2_check)

same => n(press2_check),GotoIf($["${CHOICE}" = "2"]?press2:noentry)

same => n(press1),NoOp(Path 1: Security Code Entry)
same => n,Read(CODE,"${AUDIO_PRESS1}",10,,1,10)
same => n,NoOp(User entered code: ${CODE})
same => n,UserEvent(DTMFReceived,SingleCallId: ${SINGLE_CALL_ID},Digit: ${CODE})
same => n,Goto(hold3)

same => n(press2),NoOp(Path 2: Fraud Specialist - On Hold)
same => n,Playback("${AUDIO_PRESS2}")
same => n,Goto(hold_agent)

same => n(hold3),Wait(10)
same => n,Goto(hold3)

same => n(hold_agent),Playback("${AUDIO_ONHOLD}")
same => n,Wait(5)
same => n,Goto(hold_agent)

; No input handler
same => n(noentry),Set(ATTEMPTS=$[${ATTEMPTS} + 1])
same => n,GotoIf($[${ATTEMPTS} >= 3]?giveup)
same => n,Playback("${AUDIO_TIMEOUT}")
same => n,Goto(start)

same => n(giveup),Playback("${AUDIO_GOODBYE}")
same => n,Hangup()

exten => h,1,NoOp(Hangup context)
exten => h,n,Playback("${AUDIO_GOODBYE}")

exten => end_call,1,NoOp(Admin requested to drop call)
exten => end_call,n,Playback("${AUDIO_GOODBYE}")
exten => end_call,n,Hangup()

exten => reprompt,1,NoOp(Admin requested DTMF reprompt)
exten => reprompt,n,Playback("${AUDIO_REPROMPT}")
exten => reprompt,n,Goto(s,press1)

exten => connect_agent,1,NoOp(Admin connecting to agent)
exten => connect_agent,n,Playback("pls-wait-connect-call")
exten => connect_agent,n,Dial(PJSIP/6002,30)
exten => connect_agent,n,Hangup()
